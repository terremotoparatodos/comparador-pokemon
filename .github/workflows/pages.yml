# Publica el comparador en GitHub Pages. Los retratos de SpriteCollab (CC BY-NC 4.0) no están en el repo:
# se bajan en cada publicación y viajan sólo dentro del sitio, junto con su licencia y créditos.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-portraits.mjs
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r index.html data.js fonts portraits _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
