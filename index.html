<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador Pokémon</title>
<style>
@font-face { font-family: 'Bungee'; src: url('fonts/bungee-latin.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'PressStart'; src: url('fonts/press-start-2p-latin.woff2') format('woff2'); font-display: swap; }

:root {
  --bg: #0d1326;
  --bg2: #18224a;
  --panel: #1b2550;
  --panel2: #24306a;
  --line: #34418a;
  --text: #f2f4ff;
  --muted: #9aa5d8;
  --accent: #ffcc33;
  --ok: #2fd07a;
  --bad: #ff4d5e;
  --h: #4fb3ff;
  --w: #ff9a3d;
  --s: #c6f24e;
  --cat: var(--accent);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1200px 700px at 50% -10%, var(--bg2), var(--bg));
  background-color: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, 'Segoe UI', Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
.title { font-family: Bungee, system-ui; letter-spacing: .02em; margin: 0; }
.pix { font-family: PressStart, monospace; font-size: 11px; letter-spacing: .04em; }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn {
  border: 2px solid var(--line); background: var(--panel2); border-radius: 12px;
  padding: 10px 16px; font-weight: 700; transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1400; }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.big { font-family: Bungee, system-ui; font-size: 26px; padding: 14px 34px; border-radius: 16px; }

.panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; }

/* ---------- Inicio ---------- */
.hero { text-align: center; margin: 18px 0 26px; }
.hero h1 { font-size: clamp(30px, 6vw, 56px); color: var(--accent); text-shadow: 0 4px 0 #8a5b00; }
.hero p { margin: 6px 0 0; }
.new-game { display: flex; gap: 10px; flex-wrap: wrap; }
.new-game input { flex: 1; min-width: 200px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.new-game input:focus { outline: none; border-color: var(--accent); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
.game-card { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.game-card:hover { border-color: var(--accent); }
.game-card b { font-size: 18px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.chip.live { color: var(--accent); border-color: var(--accent); }
.empty { text-align: center; padding: 30px; }

/* ---------- Partida ---------- */
.topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.topbar h2 { font-size: 22px; overflow-wrap: anywhere; }
.layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 600px) { .cats { grid-template-columns: 1fr; } }
.cat-btn { border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-radius: var(--radius); padding: 26px 12px; font-family: Bungee, system-ui; font-size: 28px; color: var(--c); }
.cat-btn small { display: block; font-family: system-ui; font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 400; }
.cat-btn:hover { background: color-mix(in srgb, var(--c) 26%, var(--panel)); }

.stage { position: relative; }
.question { text-align: center; }
.question h3 { font-size: clamp(28px, 5vw, 48px); color: var(--cat); margin: 0; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.streak { text-align: center; margin: 6px 0 16px; }
.streak b { color: var(--accent); font-family: Bungee, system-ui; font-size: 22px; }

.duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
@media (max-width: 640px) { .duel { grid-template-columns: 1fr; } .vs { justify-self: center; } }
.vs { font-family: Bungee, system-ui; font-size: 30px; color: var(--muted); }
.card { background: var(--panel); border: 3px solid var(--line); border-radius: 20px; padding: 18px; text-align: center; display: grid; justify-items: center; gap: 10px; min-height: 330px; align-content: start; }
.card .tag { color: var(--muted); }
.frame { width: 180px; height: 180px; border-radius: 18px; background: #fff; border: 4px solid #0b0f20; box-shadow: 0 6px 0 rgba(0,0,0,.35); display: grid; place-items: center; overflow: hidden; }
.frame img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
.frame.empty { background: var(--bg); border-style: dashed; border-color: var(--line); color: var(--muted); font-family: Bungee, system-ui; font-size: 48px; }
.pname { font-family: Bungee, system-ui; font-size: 24px; line-height: 1.1; }
.dex { color: var(--muted); font-size: 13px; }
.value { font-family: system-ui, 'Segoe UI', sans-serif; font-weight: 900; font-size: 30px; padding: 4px 18px; border-radius: 12px; background: var(--bg); border: 2px solid var(--cat); color: var(--cat); min-width: 150px; }
.value.hidden { color: var(--muted); border-color: var(--line); }
.value.suspense { animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(1.08); opacity: 1; } }
.card.ok { border-color: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 30%, transparent); }
.card.bad { border-color: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 30%, transparent); }
.card.ok .value { color: var(--ok); border-color: var(--ok); }
.card.bad .value { color: var(--bad); border-color: var(--bad); }
.actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

.verdict { text-align: center; margin-top: 18px; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.verdict .word { font-family: Bungee, system-ui; font-size: clamp(56px, 11vw, 110px); line-height: 1; }
.verdict.ok .word { color: var(--ok); text-shadow: 0 5px 0 #0b5c31; }
.verdict.bad .word { color: var(--bad); text-shadow: 0 5px 0 #6b0f19; }
.verdict .proof { font-size: 18px; margin-top: 8px; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Buscador */
.picker { position: relative; width: 100%; max-width: 360px; }
.picker input { width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 44px 10px 14px; }
.picker input:focus { outline: none; border-color: var(--accent); }
.picker .dice { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 36px; border: 0; border-radius: 9px; background: var(--panel2); font-size: 18px; }
.picker ul { list-style: none; margin: 6px 0 0; padding: 6px; position: absolute; z-index: 5; left: 0; right: 0; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; max-height: 340px; overflow: auto; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.picker li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.picker li img { width: 36px; height: 36px; image-rendering: pixelated; background: #fff; border-radius: 6px; }
.picker li.on { background: var(--line); }
.picker li.used { opacity: .4; cursor: default; }
.picker li small { color: var(--muted); margin-left: auto; }

/* Cadena */
.chain { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 10px; margin-top: 22px; align-items: center; }
.link { flex: none; width: 104px; text-align: center; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; }
.link img { width: 56px; height: 56px; image-rendering: pixelated; background: #fff; border-radius: 8px; }
.link .ln { font-size: 13px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.link .lv { font-size: 12px; color: var(--cat); font-weight: 700; }
.link.bad { border-color: var(--bad); }
.link.bad .lv { color: var(--bad); }
.arrow { flex: none; font-weight: 900; color: var(--ok); }
.arrow.bad { color: var(--bad); }

/* Historial */
.history h3 { font-size: 18px; margin: 0 0 10px; }
.hist { display: grid; gap: 8px; }
.hist button { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.hist button:hover { border-color: var(--accent); }
.hist .h1 { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(4,6,16,.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { width: min(760px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 20px; }
.modal table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
.modal td, .modal th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.modal th { color: var(--muted); font-weight: 600; font-size: 13px; }
.modal td img { width: 32px; height: 32px; image-rendering: pixelated; background: #fff; border-radius: 6px; vertical-align: middle; margin-right: 6px; }
.ok-t { color: var(--ok); font-weight: 800; } .bad-t { color: var(--bad); font-weight: 800; }

footer { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--muted); }
.warn { background: color-mix(in srgb, var(--bad) 20%, var(--panel)); border: 2px solid var(--bad); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="warn"></div>
  <main id="app"></main>
  <footer>
    Datos: altura, peso y velocidad base verificados en dos fuentes (PokéAPI y Pokémon Showdown); si no coincidían, el Pokémon queda fuera.
    Empate = <b>NO</b>.<br>
    Retratos: PMD SpriteCollab (<a href="portraits/LICENSE.txt">CC BY-NC 4.0</a>, autores en <a href="portraits/credits.json">portraits/credits.json</a>).
    Pokémon es marca de Nintendo / Game Freak / The Pokémon Company.
  </footer>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script>
'use strict';

// ---------- Datos ----------
const DATA = window.POKEDATA || [];
const BY_DEX = new Map(DATA.map((p) => [p.d, p]));
const num = (v) => v.toLocaleString('es-AR', { maximumFractionDigits: 2 });
const CATS = {
  h: { label: 'Altura', q: '¿ES MÁS ALTO?', not: 'no es más alto', color: 'var(--h)', fmt: (v) => `${num(v)} m`, hint: 'en metros' },
  w: { label: 'Peso', q: '¿PESA MÁS?', not: 'no pesa más', color: 'var(--w)', fmt: (v) => `${num(v)} kg`, hint: 'en kilos' },
  s: { label: 'Velocidad', q: '¿ES MÁS RÁPIDO?', not: 'no es más rápido', color: 'var(--s)', fmt: (v) => `Vel. ${v}`, hint: 'estadística base' },
};
const valueOf = (dex, cat) => BY_DEX.get(dex)?.[cat] ?? null;
const portrait = (dex) => `portraits/${dex}.png`;
const strip = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const SEARCH = DATA.map((p) => ({ p, key: strip(p.n) }));

// ---------- Guardado ----------
const KEY = 'comparador-pokemon:v1';
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const db = raw ? JSON.parse(raw) : null;
    if (db && Array.isArray(db.partidas)) return db;
  } catch (e) { storageOk = false; console.error('No se pudo leer el guardado', e); }
  return { v: 1, partidas: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; }
  catch (e) { storageOk = false; console.error('No se pudo guardar', e); }
  renderWarn();
}
let db = load();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fecha = (t) => new Date(t).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });

// ---------- Modelo ----------
// partida = { id, nombre, creada, cadenas: [cadena] }
// cadena  = { id, cat: 'h'|'w'|'s', creada, fin, estado: 'eligiendo'|'jugando'|'perdida'|'terminada',
//             pasos: [{ d, v, ok }] }   pasos[0] es el inicial (ok = null); un paso perdido tiene ok = false.
const partida = () => db.partidas.find((p) => p.id === ui.partidaId);
const activa = (p) => p.cadenas.find((c) => c.estado === 'eligiendo' || c.estado === 'jugando');
const racha = (c) => c.pasos.filter((s) => s.ok === true).length;
const actual = (c) => [...c.pasos].reverse().find((s) => s.ok !== false);
const mejorRacha = (p) => p.cadenas.reduce((m, c) => Math.max(m, racha(c)), 0);

let ui = { screen: 'home', partidaId: null, cand: null, phase: null, last: null, modal: null };

// ---------- DOM ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const app = document.getElementById('app');
function render() {
  const p = partida();
  if (ui.screen === 'partida' && !p) ui.screen = 'home';
  app.replaceChildren(ui.screen === 'home' ? viewHome() : viewPartida(p));
  if (ui.modal) app.append(ui.modal());
  const focus = app.querySelector('[data-autofocus]');
  if (focus) focus.focus();
}
function renderWarn() {
  document.getElementById('warn').replaceChildren(storageOk ? '' : h('div', { class: 'warn' },
    'Ojo: el navegador no deja guardar (modo privado o almacenamiento bloqueado). Usá «Exportar» para no perder la partida.'));
}

// ---------- Inicio ----------
function viewHome() {
  const input = h('input', { placeholder: 'Nombre de la partida (opcional)', maxlength: 60, 'data-autofocus': true,
    onkeydown: (e) => { if (e.key === 'Enter') crear(); } });
  const crear = () => {
    const nombre = input.value.trim() || `Partida ${db.partidas.length + 1}`;
    const p = { id: uid(), nombre, creada: Date.now(), cadenas: [] };
    db.partidas.unshift(p); save();
    abrir(p.id);
  };
  const list = db.partidas.length
    ? h('div', { class: 'games' }, db.partidas.map((p) => {
        const a = activa(p);
        return h('button', { class: 'game-card', onclick: () => abrir(p.id) },
          h('b', null, p.nombre),
          h('span', { class: 'muted' }, `Creada ${fecha(p.creada)}`),
          h('div', { class: 'chips' },
            h('span', { class: 'chip' }, `${p.cadenas.length} cadena${p.cadenas.length === 1 ? '' : 's'}`),
            h('span', { class: 'chip' }, `Mejor racha: ${mejorRacha(p)}`),
            a ? h('span', { class: 'chip live' }, `En juego · ${CATS[a.cat].label}`) : null));
      }))
    : h('div', { class: 'panel empty muted' }, 'Todavía no hay partidas. Creá una arriba.');
  return h('div', null,
    h('div', { class: 'hero' },
      h('h1', { class: 'title' }, 'COMPARADOR POKÉMON'),
      h('p', { class: 'muted' }, 'Elegí una categoría, un Pokémon inicial, y encadená: cada uno tiene que superar al anterior.')),
    h('div', { class: 'panel' },
      h('div', { class: 'new-game' }, input, h('button', { class: 'btn primary', onclick: crear }, 'Nueva partida'))),
    h('div', { class: 'row', style: 'margin-top:18px' },
      h('span', { class: 'pix muted' }, 'PARTIDAS GUARDADAS'), h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost', onclick: importar }, 'Importar'),
      db.partidas.length ? h('button', { class: 'btn ghost', onclick: () => exportar(db.partidas, 'comparador-pokemon-todo') }, 'Exportar todo') : null),
    list);
}
function abrir(id) { Object.assign(ui, { screen: 'partida', partidaId: id, cand: null, phase: null, last: null, modal: null }); render(); }

// ---------- Partida ----------
function viewPartida(p) {
  const c = activa(p);
  let main;
  if (ui.phase === 'result') main = viewJuego(p, ui.last.cadena);
  else if (!c) main = viewCategorias(p);
  else if (c.estado === 'eligiendo') main = viewInicial(c);
  else main = viewJuego(p, c);
  return h('div', null,
    h('div', { class: 'topbar' },
      h('button', { class: 'btn ghost', onclick: () => { ui.screen = 'home'; ui.phase = null; render(); } }, '← Partidas'),
      h('h2', { class: 'title' }, p.nombre),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost', onclick: () => renombrar(p) }, 'Renombrar'),
      h('button', { class: 'btn ghost', onclick: () => exportar([p], `partida-${strip(p.nombre) || p.id}`) }, 'Exportar'),
      h('button', { class: 'btn ghost danger', onclick: () => borrar(p) }, 'Borrar')),
    h('div', { class: 'layout' }, h('section', { class: 'panel stage' }, main), viewHistorial(p)));
}

function viewCategorias(p) {
  return h('div', null,
    h('div', { class: 'question' }, h('h3', { class: 'title', style: 'color:var(--accent)' }, 'ELEGÍ UNA CATEGORÍA')),
    h('div', { class: 'cats' }, Object.entries(CATS).map(([k, cat]) =>
      h('button', { class: 'cat-btn', style: `--c:${cat.color}`, onclick: () => {
        p.cadenas.unshift({ id: uid(), cat: k, creada: Date.now(), fin: null, estado: 'eligiendo', pasos: [] });
        save(); render();
      } }, cat.label.toUpperCase(), h('small', null, cat.hint)))));
}

function viewInicial(c) {
  const cat = CATS[c.cat];
  const sel = ui.cand;
  return h('div', { style: `--cat:${cat.color}` },
    h('div', { class: 'question' }, h('h3', { class: 'title' }, cat.label.toUpperCase())),
    h('p', { class: 'streak muted' }, 'Elegí el Pokémon inicial'),
    h('div', { style: 'display:grid;justify-items:center;gap:14px' },
      card(sel, c.cat, { tag: 'INICIAL', show: true }),
      picker(c, (d) => { ui.cand = d; render(); }, !sel),
      h('div', { class: 'actions' },
        h('button', { class: 'btn ghost danger', onclick: () => { cancelarCadena(c); } }, 'Cancelar'),
        h('button', { class: 'btn primary big', disabled: !sel, 'data-go': true, onclick: () => empezar(c) }, 'EMPEZAR'))));
}

function viewJuego(p, c) {
  const cat = CATS[c.cat];
  const res = ui.phase === 'result' ? ui.last : null;
  const cur = res ? res.prev : actual(c);
  const candDex = res ? res.next.d : ui.cand;
  const suspense = ui.phase === 'suspense';
  const lost = res && !res.ok;

  const right = card(candDex, c.cat, {
    tag: 'SIGUIENTE', show: !!res, suspense, state: res ? (res.ok ? 'ok' : 'bad') : null,
  });
  const children = [
    h('div', { class: 'question' }, h('h3', { class: 'title' }, cat.q)),
    h('div', { class: 'streak' }, h('span', { class: 'muted' }, 'Racha '), h('b', null, String(racha(c)))),
    h('div', { class: 'duel' }, card(cur.d, c.cat, { tag: 'ACTUAL', show: true }), h('div', { class: 'vs' }, 'VS'), right),
  ];
  if (res) {
    const sign = res.ok ? '>' : (res.next.v === res.prev.v ? '=' : '<');
    children.push(h('div', { class: `verdict ${res.ok ? 'ok' : 'bad'}` },
      h('div', { class: 'word' }, res.ok ? 'SÍ' : 'NO'),
      h('div', { class: 'proof' },
        `${BY_DEX.get(res.next.d).n} ${cat.fmt(res.next.v)} ${sign} ${BY_DEX.get(res.prev.d).n} ${cat.fmt(res.prev.v)}`),
      lost ? h('div', { class: 'proof muted' }, `${BY_DEX.get(res.next.d).n} ${cat.not}. Racha final: ${racha(c)}`) : null),
      h('div', { class: 'actions' },
        h('button', { class: 'btn ghost', onclick: deshacer }, '↶ Deshacer'),
        lost
          ? h('button', { class: 'btn primary big', 'data-go': true, onclick: () => { ui.phase = null; ui.last = null; render(); } }, 'NUEVA CADENA')
          : h('button', { class: 'btn primary big', 'data-go': true, onclick: () => { ui.phase = null; ui.last = null; render(); } }, 'SEGUIR')));
  } else {
    children.push(h('div', { style: 'display:grid;justify-items:center;margin-top:14px' },
      suspense ? null : picker(c, (d) => { ui.cand = d; render(); }, !ui.cand)),
      h('div', { class: 'actions' },
        h('button', { class: 'btn ghost', disabled: suspense || c.pasos.length < 2, onclick: deshacer }, '↶ Deshacer'),
        h('button', { class: 'btn ghost', disabled: suspense, onclick: () => terminarCadena(c) }, 'Terminar cadena'),
        h('button', { class: 'btn primary big', disabled: !ui.cand || suspense, 'data-go': true, onclick: () => validar(c) }, 'VALIDAR')));
  }
  children.push(viewCadena(c));
  return h('div', { style: `--cat:${cat.color}` }, children);
}

function card(dex, catKey, { tag, show, suspense, state }) {
  const cat = CATS[catKey];
  const p = dex != null ? BY_DEX.get(dex) : null;
  let value;
  if (!p) value = h('div', { class: 'value hidden' }, '—');
  else if (suspense) value = h('div', { class: 'value hidden suspense' }, '···');
  else if (show) value = h('div', { class: 'value' }, cat.fmt(p[catKey]));
  else value = h('div', { class: 'value hidden' }, '???');
  return h('div', { class: `card ${state || ''}` },
    h('span', { class: 'pix tag' }, tag),
    p ? h('div', { class: 'frame' }, h('img', { src: portrait(p.d), alt: p.n })) : h('div', { class: 'frame empty' }, '?'),
    h('div', { class: 'pname' }, p ? p.n : 'Elegí un Pokémon'),
    h('div', { class: 'dex' }, p ? `N.º ${p.d}` : ' '),
    value);
}

function viewCadena(c) {
  const cat = CATS[c.cat];
  const kids = [];
  c.pasos.forEach((s, i) => {
    if (i > 0) kids.push(h('span', { class: `arrow ${s.ok ? '' : 'bad'}` }, s.ok ? '<' : '✘'));
    const p = BY_DEX.get(s.d);
    kids.push(h('div', { class: `link ${s.ok === false ? 'bad' : ''}` },
      h('img', { src: portrait(s.d), alt: '' }), h('div', { class: 'ln' }, p.n), h('div', { class: 'lv' }, cat.fmt(s.v))));
  });
  const el = h('div', { class: 'chain' }, kids);
  requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
  return el;
}

function viewHistorial(p) {
  const items = p.cadenas.filter((c) => c.pasos.length);
  return h('aside', { class: 'panel history' },
    h('h3', { class: 'title' }, 'Historial'),
    items.length ? h('div', { class: 'hist' }, items.map((c) => {
      const cat = CATS[c.cat];
      const ini = BY_DEX.get(c.pasos[0].d).n;
      const estado = { jugando: 'en juego', perdida: 'perdida', terminada: 'terminada' }[c.estado] || c.estado;
      return h('button', { onclick: () => { ui.modal = () => viewDetalle(p, c); render(); } },
        h('span', { class: 'h1', style: `--c:${cat.color}` }, h('span', { class: 'dot' }), `${cat.label} · racha ${racha(c)}`),
        h('span', { class: 'muted' }, `Desde ${ini} · ${estado}`),
        h('span', { class: 'muted', style: 'font-size:12px' }, fecha(c.creada)));
    })) : h('p', { class: 'muted' }, 'Las cadenas que juegues quedan acá.'));
}

function viewDetalle(p, c) {
  const cat = CATS[c.cat];
  const close = () => { ui.modal = null; render(); };
  const rows = c.pasos.map((s, i) => {
    const prev = i > 0 ? c.pasos[i - 1] : null;
    const n = BY_DEX.get(s.d).n;
    let res = h('span', { class: 'muted' }, 'inicial');
    if (prev) {
      const sign = s.ok ? '>' : (s.v === prev.v ? '=' : '<');
      res = h('span', { class: s.ok ? 'ok-t' : 'bad-t' }, `${s.ok ? 'SÍ' : 'NO'} · ${cat.fmt(s.v)} ${sign} ${cat.fmt(prev.v)}`);
    }
    return h('tr', null, h('td', null, String(i + 1)), h('td', null, h('img', { src: portrait(s.d), alt: '' }), `${n} (N.º ${s.d})`),
      h('td', null, cat.fmt(s.v)), h('td', null, res));
  });
  return h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === e.currentTarget) close(); } },
    h('div', { class: 'modal' },
      h('div', { class: 'row' }, h('h3', { class: 'title', style: `margin:0;color:${cat.color}` }, `${cat.label} · racha ${racha(c)}`),
        h('span', { class: 'spacer' }), h('button', { class: 'btn ghost', onclick: close }, 'Cerrar')),
      h('p', { class: 'muted', style: 'margin:6px 0 0' }, `${p.nombre} · empezada ${fecha(c.creada)}${c.fin ? ` · terminada ${fecha(c.fin)}` : ''}`),
      h('table', null, h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, 'Pokémon'), h('th', null, cat.label), h('th', null, 'Resultado'))),
        h('tbody', null, rows)),
      c.estado === 'jugando' || c.estado === 'eligiendo' ? null
        : h('div', { class: 'actions' }, h('button', { class: 'btn ghost danger', onclick: () => {
            if (!confirm('¿Borrar esta cadena del historial?')) return;
            p.cadenas = p.cadenas.filter((x) => x !== c); save(); close();
          } }, 'Borrar cadena'))));
}

// ---------- Buscador ----------
function picker(c, onPick, autofocus) {
  const used = new Set(c.pasos.map((s) => s.d));
  const field = c.cat;
  const input = h('input', { placeholder: 'Buscar por nombre o número…', autocomplete: 'off', spellcheck: 'false', 'data-autofocus': autofocus || null });
  const list = h('ul', { hidden: true });
  let items = [], on = 0;
  const pickable = (p) => !used.has(p.d) && p[field] != null;
  const pick = (p) => { if (p && pickable(p)) onPick(p.d); };
  function update() {
    const q = strip(input.value);
    if (!q) { list.hidden = true; return; }
    const n = /^\d+$/.test(q) ? Number(q) : null;
    const starts = [], has = [];
    for (const { p, key } of SEARCH) {
      if (n != null ? p.d === n : key.startsWith(q)) starts.push(p);
      else if (n == null && key.includes(q)) has.push(p);
    }
    items = [...starts, ...has].slice(0, 10);
    on = Math.max(0, items.findIndex(pickable));
    list.replaceChildren(...(items.length ? items.map((p, i) => h('li', {
      class: `${i === on ? 'on' : ''} ${pickable(p) ? '' : 'used'}`,
      onmousedown: (e) => { e.preventDefault(); pick(p); },
    }, h('img', { src: portrait(p.d), alt: '' }), p.n, h('small', null, used.has(p.d) ? 'ya en la cadena' : `N.º ${p.d}`)))
      : [h('li', { class: 'used' }, 'Sin resultados')]));
    list.hidden = false;
  }
  function move(dir) {
    if (!items.length) return;
    for (let k = 1; k <= items.length; k++) {
      const i = (on + dir * k + items.length) % items.length;
      if (pickable(items[i])) { on = i; break; }
    }
    [...list.children].forEach((li, i) => li.classList.toggle('on', i === on));
    list.children[on]?.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('input', update);
  input.addEventListener('blur', () => { list.hidden = true; });
  input.addEventListener('focus', update);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!list.hidden && items[on]) pick(items[on]); }
    else if (e.key === 'Escape') { list.hidden = true; }
  });
  const dice = h('button', { class: 'dice', title: 'Al azar', onclick: () => {
    const pool = DATA.filter(pickable);
    if (pool.length) onPick(pool[Math.floor(Math.random() * pool.length)].d);
  } }, '🎲');
  return h('div', { class: 'picker' }, input, dice, list);
}

// ---------- Acciones ----------
function empezar(c) {
  if (ui.cand == null) return;
  c.pasos.push({ d: ui.cand, v: valueOf(ui.cand, c.cat), ok: null });
  c.estado = 'jugando';
  ui.cand = null; save(); render();
}
function validar(c) {
  if (ui.cand == null || ui.phase) return;
  const prev = actual(c);
  const d = ui.cand;
  ui.phase = 'suspense'; render();
  setTimeout(() => {
    const v = valueOf(d, c.cat);
    const ok = v > prev.v;                       // empate = NO
    const next = { d, v, ok };
    c.pasos.push(next);
    if (!ok) { c.estado = 'perdida'; c.fin = Date.now(); }
    save();
    ui.cand = null;
    ui.phase = 'result';
    ui.last = { ok, prev, next, cadena: c };
    render();
  }, 900);
}
function deshacer() {
  const p = partida();
  const c = ui.phase === 'result' ? ui.last.cadena : activa(p);
  if (!c || c.pasos.length < 2) return;
  c.pasos.pop();
  c.estado = 'jugando'; c.fin = null;
  Object.assign(ui, { phase: null, last: null, cand: null });
  save(); render();
}
function terminarCadena(c) {
  if (!confirm('¿Terminar esta cadena sin perder? Queda guardada en el historial.')) return;
  c.estado = 'terminada'; c.fin = Date.now(); ui.cand = null; save(); render();
}
function cancelarCadena(c) {
  const p = partida();
  p.cadenas = p.cadenas.filter((x) => x !== c); ui.cand = null; save(); render();
}
function renombrar(p) {
  const n = prompt('Nuevo nombre de la partida', p.nombre);
  if (n && n.trim()) { p.nombre = n.trim().slice(0, 60); save(); render(); }
}
function borrar(p) {
  if (!confirm(`¿Borrar la partida «${p.nombre}» con todas sus cadenas? No se puede deshacer (salvo que la hayas exportado).`)) return;
  db.partidas = db.partidas.filter((x) => x !== p); save();
  ui.screen = 'home'; render();
}
function exportar(partidas, nombre) {
  const blob = new Blob([JSON.stringify({ app: 'comparador-pokemon', v: 1, exportado: new Date().toISOString(), partidas }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `${nombre}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileInput = document.getElementById('importFile');
function importar() { fileInput.value = ''; fileInput.click(); }
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data.partidas) ? data.partidas : [];
    const valid = list.filter((p) => p && typeof p.id === 'string' && typeof p.nombre === 'string' && Array.isArray(p.cadenas));
    if (!valid.length) throw new Error('El archivo no tiene partidas.');
    let nuevas = 0, reemplazadas = 0;
    for (const p of valid) {
      const i = db.partidas.findIndex((x) => x.id === p.id);
      if (i >= 0) { db.partidas[i] = p; reemplazadas++; } else { db.partidas.unshift(p); nuevas++; }
    }
    save(); render();
    alert(`Importado: ${nuevas} nueva(s), ${reemplazadas} reemplazada(s).`);
  } catch (e) {
    alert(`No se pudo importar: ${e.message}`);
  }
});

// Enter = botón principal (Empezar / Validar / Seguir) cuando el foco no está en el buscador.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); return; }
  if (e.key !== 'Enter' || ['INPUT', 'BUTTON'].includes(e.target.tagName) || ui.modal) return;
  const go = app.querySelector('[data-go]:not([disabled])');
  if (go) { e.preventDefault(); go.click(); }
});

if (!DATA.length) app.textContent = 'Falta data.js — corré: node scripts/build-data.mjs';
else { renderWarn(); render(); }
</script>
